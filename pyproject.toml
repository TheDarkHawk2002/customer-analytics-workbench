[project]
name = "customer-analytics-workbench"
version = "0.1.0"
description = "A reproducible customer-support analytics pipeline using synthetic data"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
customer-analytics = "customer_analytics.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
